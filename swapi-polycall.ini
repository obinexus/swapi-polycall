# swapi-polycall settings (INI). This is this package's own file; it is NOT
# a Polycall configuration (Polycallfile / *polycallrc) and the Polycall core
# does not read it.
[polycall]
name=swapi-polycall
mode=adapter
verify_before_execute=true

[remote]
base_url=https://swapi.dev/api
timeout_ms=5000

[operations]
people=people
planets=planets
starships=starships
films=films
species=species
vehicles=vehicles
